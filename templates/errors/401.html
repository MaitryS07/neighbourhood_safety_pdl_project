{% extends "base.html" %}

{% block title %}Unauthorized - Neighbourhood Safety{% endblock %}

{% block content %}
<div class="members-container">
    <div style="text-align: center; padding: 4rem 2rem;">
        <div style="font-size: 8rem; font-weight: bold; color: #e74c3c; margin-bottom: 1rem;">
            401
        </div>
        <h1 style="font-size: 2rem; color: #2c3e50; margin-bottom: 1rem;">
            Unauthorized
        </h1>
        <p style="color: #7f8c8d; font-size: 1.1rem; margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;">
            You need to log in to access this page. Please sign in to continue.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
            <a href="{{ url_for('auth.signup') }}" class="btn btn-secondary">
                <i class="fas fa-user-plus"></i> Sign Up
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                <i class="fas fa-home"></i> Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
